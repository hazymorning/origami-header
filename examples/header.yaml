type: custom:origami-header-card
mode: header
cards:
  - type: heading
    heading: Home Assistant
    badges:
      - type: entity
        entity: sensor.system_monitor_processor_use
        icon: mdi:gauge
        tap_action:
          action: navigate
          navigation_path: /config/hardware
      - type: entity
        entity: sensor.system_monitor_memory_usage
        icon: mdi:memory
        tap_action:
          action: navigate
          navigation_path: /config/hardware
      - type: entity
        entity: sensor.system_monitor_disk_usage
        icon: mdi:harddisk
        tap_action:
          action: navigate
          navigation_path: /config/storage
buttons:
  - icon: mdi:pencil-outline
    special: edit
  - icon: mdi:cog-outline
    tap_action:
      action: navigate
      navigation_path: /config/dashboard
  - icon: mdi:power
    color: red
    hold_action:
      action: perform-action
      perform_action: homeassistant.restart
      confirmation:
        text: Restart Home Assistant?
  - icon: mdi:menu
    special: sidebar
