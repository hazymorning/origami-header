# Opens from another card, see "Opening the menu" in the README.
type: custom:origami-header-card
mode: menu
layout: grid
cards:
  - type: heading
    heading: Home Assistant
    badges:
      - type: entity
        entity: sensor.system_monitor_processor_use
        icon: mdi:gauge
      - type: entity
        entity: sensor.system_monitor_memory_usage
        icon: mdi:memory
      - type: entity
        entity: sensor.system_monitor_disk_usage
        icon: mdi:harddisk
buttons:
  - name: Edit
    icon: mdi:pencil-outline
    color: amber
    special: edit
  - name: Automations
    icon: mdi:robot-outline
    color: blue
    tap_action:
      action: navigate
      navigation_path: /config/automation/dashboard
  - name: Settings
    icon: mdi:cog-outline
    color: green
    tap_action:
      action: navigate
      navigation_path: /config/dashboard
  - name: Sidebar
    icon: mdi:menu
    special: sidebar
  - name: Restart
    icon: mdi:power
    color: red
    hold_action:
      action: perform-action
      perform_action: homeassistant.restart
      confirmation:
        text: Restart Home Assistant?
css: |
  .scrim {
    -webkit-backdrop-filter: blur(14px);
    backdrop-filter: blur(14px);
  }
