<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --primary-background-color: #fafafa;
    --app-header-background-color: #03a9f4;
    --app-header-text-color: #ffffff;
    --primary-text-color: #212121;
    --secondary-text-color: #727272;
  }
  html, body { margin: 0; background: var(--primary-background-color); font-family: sans-serif; }
</style>
</head>
<body>
<script type="module">
  const params = new URLSearchParams(location.search);
  if (params.has("lang")) document.documentElement.lang = params.get("lang");
  if (params.has("noslot")) window.noslot = true;

  const loadModule = async () => {
    await import("/origami-header.js");
    if (params.has("twice")) await import("/origami-header.js?second");
  };
  // Home Assistant ships the registry polyfill in its app bundle, which may load before or after extra modules.
  const loadApp = async () => {
    await import("/node_modules/@webcomponents/scoped-custom-element-registry/scoped-custom-element-registry.min.js");
    await import("./mock-ha.js");
  };
  window.ready = params.get("order") === "app-first" ? loadApp().then(loadModule) : loadModule().then(loadApp);
</script>
</body>
</html>
